{% extends "base.html" %}
{% block title %}Connexion · Relances Equation{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:60px auto">
  <div style="text-align:center"><div style="font-size:34px">✉️</div>
    <h1>Relances <span class="accent">ciblées</span></h1>
    <p class="small" style="margin:4px 0 18px">Connecte-toi avec ton adresse Équation</p></div>
  <form method="post">
    <label>Adresse e-mail OVH</label>
    <input type="text" name="email" placeholder="prenom@equation-sie.com" autofocus required>
    <label>Mot de passe OVH</label>
    <input type="password" name="password" required>
    <div style="margin-top:18px"><button class="btn" style="width:100%;justify-content:center" type="submit">Entrer →</button></div>
  </form>
  <p class="small" style="margin-top:14px;text-align:center">Tes mails partiront de ta propre boîte. Le mot de passe n'est jamais stocké.</p>
</div>
{% endblock %}
